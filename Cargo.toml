[package]
name = "metabase-datasource-sync"
version = "0.2.3"
edition = "2021"
# Plancher réel de l'arbre de dépendances (le plus haut des `rust-version` verrouillés : les crates
# `icu_*` 2.3 et `time` 0.3), et version du canal épinglé dans `rust-toolchain.toml` : le contrat
# déclaré est celui qui compile. `task msrv` vérifie qu'ils ne divergent pas.
rust-version = "1.88"
description = "Réconcilie les sources de données Metabase avec des credentials à rotation"
license = "Apache-2.0"

[dependencies]
# Client HTTP bloquant : une requête toutes les 30 s, aucun besoin d'un runtime async.
# `rustls` compile les certificats racines dans le binaire, ce qui permet une image `scratch`
# sans bundle CA.
ureq = { version = "3", features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"   # sans `preserve_order` : les clés restent triées, donc la sérialisation est canonique (empreinte stable)
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
