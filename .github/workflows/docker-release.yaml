name: 📦 Docker Release

# Même déclencheur et même registre que les autres outils SocialGouv (cf. oblik) : `main` publie
# une image de tête, un tag `vX.Y.Z` publie la version. Le chart consommateur, lui, épingle par
# DIGEST — un tag reste mutable.
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

concurrency:
  cancel-in-progress: true
  group: docker-release-${{ github.ref_name }}

jobs:
  # Un tag ne publie que ce que la CI a éprouvé. `ci.yml` ne tourne pas sur un tag, et un ruleset
  # sur `main` ne protège pas les tags : sans ce garde, un `git tag` posé sur n'importe quel commit
  # publie une image que rien n'a vérifiée. L'accord tag ↔ `Cargo.toml` plus bas ne dit rien de la
  # CI — il vérifie que le binaire annonce la bonne version, pas qu'il compile.
  #
  # Ne concerne que les tags : une poussée sur `main` produit un commit NEUF (squash), dont la CI
  # démarre au même instant. Exiger ses checks ici bloquerait chaque merge.
  tag-eprouve:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          # L'ascendance se lit sur l'historique complet ; un checkout superficiel n'a pas de quoi
          # répondre.
          fetch-depth: 0

      - name: Le commit du tag est sur main
        run: |
          set -eu
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Le commit $GITHUB_SHA n'est pas un ancêtre de main : il n'est jamais passé par" >&2
            echo "le ruleset, donc rien ne garantit qu'il ait été relu ni testé. Refus." >&2
            exit 1
          fi

      - name: Les checks requis sont verts sur CE commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh hack/check-release-commit.sh "$GITHUB_SHA"

  build-and-push-image:
    needs: [tag-eprouve]
    # `needs` sur un job filtré par `if` rend `skipped`, ce qui annulerait la publication de `main`.
    # La condition dit donc : le garde a réussi, ou il ne s'appliquait pas.
    if: always() && (needs.tag-eprouve.result == 'success' || needs.tag-eprouve.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Un tag `vX.Y.Z` qui ne correspond pas à la version du binaire produit un `--version` qui
      # ment — et c'est en diagnostic qu'on s'en aperçoit, au pire moment. On refuse de publier.
      - name: Le tag correspond à la version du paquet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME mais Cargo.toml en $CARGO_VERSION — refus de publier." >&2
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # arm64 inclus : les postes de développement et certains nœuds en sont, et le coût est
          # marginal pour un binaire statique de moins de 2 Mo.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Digest publié
        run: |
          echo "Image poussée. Digest à épingler dans le chart (values `image.digest`) :"
          echo "${{ steps.push.outputs.digest }}"
