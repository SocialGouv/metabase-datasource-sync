name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Aucune version de Rust n'est choisie ici : `rust-toolchain.toml` la nomme, et rustup —
      # préinstallé sur le runner — la pose au premier appel de cargo. Ce job compile donc avec le
      # même compilateur que le poste de travail et que l'image publiée.
      - uses: arduino/setup-task@v3
        with:
          # Task est le lanceur, pas une dépendance du binaire : les versions qui décident du
          # résultat sont épinglées par `rust-toolchain.toml` et `Cargo.lock`.
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # La porte est définie une seule fois, dans le Taskfile. Recopier ses commandes ici les
      # laisserait diverger — et c'est le vert de la CI qui mentirait.
      #
      # Elle inclut la suite d'ACCEPTATION, qui pilote le binaire compilé contre un faux Metabase
      # reproduisant les comportements du vrai (fusion de `details`, remise à zéro des champs
      # absents d'un PUT, throttling des connexions). C'est elle qui a prouvé la parité avec
      # l'implémentation Python d'origine ; elle doit rester verte, sans quoi la réécriture perd
      # son filet.
      - name: Porte complète (msrv, format, clippy, unitaires, acceptation)
        run: task check

  # Acceptation contre un VRAI Metabase et un VRAI PostgreSQL. La suite du job `test` pilote un faux
  # Metabase : elle vérifie le comportement du programme, pas le contrat réel de l'API — or ce
  # contrat bouge d'une version à l'autre. Bumper l'image ci-dessous est la façon de détecter cette
  # dérive AVANT de la découvrir en production.
  acceptance-reelle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      metabase:
        # `MB_ENCRYPTION_SECRET_KEY` posée comme en production : c'est ce qui rend `details`
        # chiffré, donc ce qui interdit toute écriture SQL directe et justifie ce programme.
        image: metabase/metabase:v0.63.15
        env:
          MB_ENCRYPTION_SECRET_KEY: cle-de-test-suffisamment-longue-pour-metabase
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Scénario réel (création, requête SQL, rotation, requête après rotation)
        env:
          MB_URL: http://localhost:3000
          # Metabase est un conteneur du même réseau : il joint PostgreSQL par son nom de service,
          # tandis que le script y accède par le port publié sur le runner.
          PG_HOST_FOR_METABASE: postgres
          PG_LOCAL: localhost
          PG_LOCAL_PORT: "5432"
        run: task acceptance:real

  image:
    # Vérifie que l'image `scratch` se construit et démarre — une image qui ne peut pas se lancer
    # échouerait sinon au premier déploiement, pas ici.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction et démarrage
        run: task image
